        run: |
          import base64, hashlib, io, json, os, pathlib, zipfile
          data = base64.b64decode(os.environ["SOURCE_ZIP"])
          if hashlib.sha256(data).hexdigest() != "59d5ba96859a90d9a2849dece80915c670e41c18ebfdddfbb4887f9a46c33e10":
              raise RuntimeError("Release archive checksum mismatch")
          import subprocess
          expected = json.loads("{\"lib/validate.js\":\"f72590742283b9d563c32ea926dfad77d124fcd0\",\"package.json\":\"ea711b3f03da3d5684a0cfe2f92215e524e15993\",\"pnpm-lock.yaml\":\"2a9b6a165e2eb2d452c66bf3df8f90532ba76201\",\"lib/aiPipeline.js\":\"fcb34212e58bbe6a6ad21eaeb6f7ef888be955e5\",\"README.md\":\"50effe302ce418d3ff74530069a3e2e679ecc3a3\",\"lib/transcript.js\":null,\"tests/transcript.test.js\":null}")
          for path, sha in expected.items():
              current = subprocess.run(["git", "rev-parse", "HEAD:" + path], capture_output=True, text=True)
              if (sha is None and current.returncode == 0) or (sha is not None and (current.returncode != 0 or current.stdout.strip() != sha)):
                  raise RuntimeError("Source changed since verification: " + path)
          with zipfile.ZipFile(io.BytesIO(data)) as source_archive:
              if set(source_archive.namelist()) != set(expected):
                  raise RuntimeError("Unexpected release files")
          root = pathlib.Path.cwd().resolve()
          roots = {"lib", "pages", "styles", "supabase", "tests", "docs"}
          files = {".env.example", ".gitignore", "README.md", "package.json", "pnpm-lock.yaml", "next.config.js", "postcss.config.js", "tailwind.config.js"}
          staged = []
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename.replace(chr(92), "/"))
                  if path.is_absolute() or ".." in path.parts or not (path.parts[0] in roots or str(path) in files):
                      raise RuntimeError("Unapproved source path: " + str(path))
                  if entry.is_dir():
                      continue
                  target = root.joinpath(*path.parts).resolve()
                  if not target.is_relative_to(root) or entry.file_size > 1000000:
                      raise RuntimeError("Unsafe source path or size")
                  if target.is_symlink():
                      raise RuntimeError("Source path is a symlink")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
                  staged.append(str(path))
          pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").write_text(json.dumps(staged))
          print("Prepared", len(staged), "reviewed source files.")
      - name: Install exact locked dependencies
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
      - name: Commit verified source to the release branch
        shell: python
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          branch = os.environ["RELEASE_BRANCH"]
          if branch != "kaarya/transcript-grounding-20260828":
              raise RuntimeError("Refusing to modify any other branch")
          git("fetch", "origin", branch)
          if git("rev-parse", "HEAD") != git("rev-parse", "origin/" + branch):
              raise RuntimeError("Branch changed during verification; review before retrying")
          paths = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").read_text())
          workflow = pathlib.Path(".github/workflows/kaarya-transcript-fix.yml")
          workflow.unlink()
          git("add", "--", *paths, str(workflow))
          print(git("diff", "--cached", "--stat"))
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("commit", "-m", "Fix source grounding for VTT and SRT meeting transcripts")
          git("push", "origin", "HEAD:refs/heads/" + branch)
