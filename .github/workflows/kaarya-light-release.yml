          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if len(archive.namelist()) != len(expected) or set(archive.namelist()) != set(expected):
                  raise RuntimeError("Unapproved release files")
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts or entry.is_dir() or entry.file_size > 1000000:
                      raise RuntimeError("Unsafe release entry")
                  target = root.joinpath(*path.parts)
                  if target.is_symlink() or not target.resolve().is_relative_to(root):
                      raise RuntimeError("Unsafe release target")
                  content = archive.read(entry)
                  if hashlib.sha256(content).hexdigest() != expected[str(path)]:
                      raise RuntimeError("File checksum mismatch: " + str(path))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").write_text(json.dumps(list(expected)))
          print("Verified and prepared", len(expected), "source files")
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Run regression tests
        run: pnpm test
      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
      - name: Commit verified source to the release branch
        shell: python
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          branch = os.environ["RELEASE_BRANCH"]
          if branch != "kaarya/light-transcripts-20260828":
              raise RuntimeError("Refusing to change another branch")
          if git("ls-remote", "origin", "refs/heads/main").split()[0] != "15d5f9b32e843d923c7bc74696806b5ab448b55c":
              raise RuntimeError("Main changed during verification; review before publishing")
          git("fetch", "origin", branch)
          if git("rev-parse", "HEAD") != git("rev-parse", "origin/" + branch):
              raise RuntimeError("Release branch changed during verification")
          paths = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").read_text())
          workflow = pathlib.Path(".github/workflows/kaarya-light-release.yml")
          workflow.unlink()
          git("add", "--", *paths, str(workflow))
          print(git("diff", "--cached", "--stat"))
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("commit", "-m", "Launch light workspace, complete minutes and resumable transcripts")
          git("push", "origin", "HEAD:refs/heads/" + branch)
