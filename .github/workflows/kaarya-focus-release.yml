        run: |
          import base64, hashlib, io, json, os, pathlib, zipfile
          data = base64.b64decode(os.environ["SOURCE_ZIP"])
          if hashlib.sha256(data).hexdigest() != "7b018b0c46cc59680ecfa2e00e90e3a9c9573ae925f206244719e425c21722e1":
              raise RuntimeError("Release archive checksum mismatch")
          root = pathlib.Path.cwd().resolve()
          roots = {"lib", "pages", "styles", "supabase", "tests", "docs"}
          files = {".env.example", ".gitignore", "README.md", "package.json", "pnpm-lock.yaml", "next.config.js", "postcss.config.js", "tailwind.config.js"}
          staged = []
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename.replace(chr(92), "/"))
                  if path.is_absolute() or ".." in path.parts or not (path.parts[0] in roots or str(path) in files):
                      raise RuntimeError("Unapproved source path: " + str(path))
                  if entry.is_dir():
                      continue
                  target = root.joinpath(*path.parts).resolve()
                  if not target.is_relative_to(root) or entry.file_size > 1000000:
                      raise RuntimeError("Unsafe source path or size")
                  if target.is_symlink():
                      raise RuntimeError("Source path is a symlink")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
                  staged.append(str(path))
          pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").write_text(json.dumps(staged))
          print("Prepared", len(staged), "reviewed source files.")
      - name: Install exact locked dependencies
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
      - name: Commit verified source to the release branch
        shell: python
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          branch = os.environ["RELEASE_BRANCH"]
          if branch != "kaarya/focus-release-20260827":
              raise RuntimeError("Refusing to modify any other branch")
          git("fetch", "origin", branch)
          if git("rev-parse", "HEAD") != git("rev-parse", "origin/" + branch):
              raise RuntimeError("Branch changed during verification; review before retrying")
          paths = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "kaarya-source-paths.json").read_text())
          workflow = pathlib.Path(".github/workflows/kaarya-focus-release.yml")
          workflow.unlink()
          git("add", "--", *paths, str(workflow))
          print(git("diff", "--cached", "--stat"))
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("commit", "-m", "Fix Gemini schema transport and classify provider failures safely")
          git("push", "origin", "HEAD:refs/heads/" + branch)
